name: word-light_document_builder

run-name: ${{ github.event.head_commit.message }}
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - stage

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
      - run: ./gradlew clean build

  # TODO: clean this up when used again
  push_to_Dockerhub:
    # NOTE: ${{}} syntax does not work here
    if: (github.head_ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/word_light_document_builder:latest

  deploy_to_server:
    # NOTE: ${{}} syntax does not work here
    if: (github.head_ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    needs: push_to_Dockerhub

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: word-light.de
          username: ${{ secrets.SSH_USER_NAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          debug: true
          # pull new image, remove left overs from old image, start microservice
          script: |
            docker-compose pull api
            yes | docker rm $(docker container ls --all --filter=ancestor=$(docker images -f "dangling=true" -q) --format "{{.ID}}") --force
            yes | docker image rm $(docker images -f "dangling=true" -q)
            docker-compose up -d
